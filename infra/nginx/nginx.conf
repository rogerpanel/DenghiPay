user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 2048;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # No IP addresses in the access log: an access log is a log, and guardrail 9
  # applies to it. The hashed remote address is enough to correlate abuse.
  map $remote_addr $remote_addr_hashed {
    default "";
  }

  log_format json escape=json '{'
    '"time":"$time_iso8601",'
    '"method":"$request_method",'
    '"path":"$uri",'
    '"status":$status,'
    '"bytes":$body_bytes_sent,'
    '"duration":$request_time,'
    '"referrer":"$http_referer",'
    '"correlation_id":"$http_x_correlation_id"'
  '}';

  access_log /var/log/nginx/access.log json;

  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;
  server_tokens off;
  client_max_body_size 12m;   # KYC document uploads
  client_body_timeout 30s;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/json application/javascript application/manifest+json image/svg+xml;

  # TLS 1.2+ only. The callback specification requires it of our partners, so
  # we hold ourselves to it too (TECHNICAL_ARCHITECTURE §4.1).
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;
  ssl_stapling on;
  ssl_stapling_verify on;

  # Defence in depth on top of the API's own limiter. Registration is stricter
  # than the rest: it is the endpoint bots find first.
  limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
  limit_req_zone $binary_remote_addr zone=auth:10m rate=1r/s;
  limit_req_status 429;

  include /etc/nginx/conf.d/*.conf;
}
