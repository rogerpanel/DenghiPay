# MoraPay virtual hosts (BUILD_PLAN 12.3, 12.5).
#
# Replace morapay.example with the real domain once it is registered. The three
# names are deliberate: the sender app, the API and the back office are separate
# origins, so a cross-site problem in one does not reach the others.

# ---------------------------------------------------------------- HTTP → HTTPS
server {
  listen 80;
  listen [::]:80;
  server_name morapay.example api.morapay.example admin.morapay.example;

  # The one path that stays on HTTP, for the ACME challenge.
  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

# ------------------------------------------------------------- sender PWA
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name morapay.example;

  ssl_certificate /etc/letsencrypt/live/morapay.example/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/morapay.example/privkey.pem;

  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://api.morapay.example; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

  location / {
    proxy_pass http://web:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

# --------------------------------------------------------------------- API
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name api.morapay.example;

  ssl_certificate /etc/letsencrypt/live/api.morapay.example/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/api.morapay.example/privkey.pem;

  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;

  limit_req zone=api burst=20 nodelay;

  location ~ ^/(auth/(login|register|refresh)) {
    limit_req zone=auth burst=5 nodelay;
    proxy_pass http://api:4000;
    include /etc/nginx/conf.d/proxy-headers.inc;
  }

  # Provider callbacks. The signature covers the raw request bytes, so nothing
  # here may buffer, rewrite or re-encode the body.
  location /webhooks/ {
    proxy_pass http://api:4000;
    proxy_request_buffering off;
    include /etc/nginx/conf.d/proxy-headers.inc;
  }

  # Metrics are for Prometheus on the internal network, not for the internet.
  location /metrics {
    deny all;
    return 404;
  }

  location / {
    proxy_pass http://api:4000;
    include /etc/nginx/conf.d/proxy-headers.inc;
  }
}

# -------------------------------------------------------------- back office
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name admin.morapay.example;

  ssl_certificate /etc/letsencrypt/live/admin.morapay.example/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/admin.morapay.example/privkey.pem;

  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
  add_header X-Frame-Options "DENY" always;
  add_header X-Robots-Tag "noindex, nofollow" always;

  # An office IP allowlist belongs here in production. Uncomment and fill in
  # once the office ranges are known; it is defence in depth on top of the
  # separate staff authentication, never a replacement for it.
  # allow 203.0.113.0/24;
  # deny all;

  location / {
    proxy_pass http://admin:3000;
    include /etc/nginx/conf.d/proxy-headers.inc;
  }
}
