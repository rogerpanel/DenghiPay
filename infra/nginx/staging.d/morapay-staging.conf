# Staging edge (BUILD_PLAN 12.5): behind basic auth, and never indexed.

server {
  listen 80;
  server_name staging.morapay.example staging-api.morapay.example staging-admin.morapay.example;
  location /.well-known/acme-challenge/ { root /var/www/certbot; }
  location / { return 301 https://$host$request_uri; }
}

server {
  listen 443 ssl;
  http2 on;
  server_name staging.morapay.example;

  ssl_certificate /etc/letsencrypt/live/staging.morapay.example/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/staging.morapay.example/privkey.pem;

  # Both, not either: the header keeps it out of an index, basic auth keeps it
  # out of a browser that found the URL anyway.
  add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
  auth_basic "MoraPay staging";
  auth_basic_user_file /etc/nginx/htpasswd;

  location / {
    proxy_pass http://web:3000;
    include /etc/nginx/conf.d/proxy-headers.inc;
  }
}

server {
  listen 443 ssl;
  http2 on;
  server_name staging-api.morapay.example;

  ssl_certificate /etc/letsencrypt/live/staging-api.morapay.example/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/staging-api.morapay.example/privkey.pem;

  add_header X-Robots-Tag "noindex, nofollow" always;

  # The API is deliberately not behind basic auth: the deploy pipeline's smoke
  # test has to reach it, and it has its own authentication.
  location / {
    proxy_pass http://api:4000;
    include /etc/nginx/conf.d/proxy-headers.inc;
  }
}

server {
  listen 443 ssl;
  http2 on;
  server_name staging-admin.morapay.example;

  ssl_certificate /etc/letsencrypt/live/staging-admin.morapay.example/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/staging-admin.morapay.example/privkey.pem;

  add_header X-Robots-Tag "noindex, nofollow" always;
  auth_basic "MoraPay staging";
  auth_basic_user_file /etc/nginx/htpasswd;

  location / {
    proxy_pass http://admin:3000;
    include /etc/nginx/conf.d/proxy-headers.inc;
  }
}
