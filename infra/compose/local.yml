# Local development stack (BUILD_PLAN 0.5).
#
# Nothing here is production configuration. Credentials are fixed, well-known
# and local-only, which is why gitleaks allowlists exactly this pair.
name: morapay-local

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: morapay
      POSTGRES_PASSWORD: morapay
      POSTGRES_DB: morapay
    ports: ['5432:5432']
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../scripts/init-partitions.sql:/docker-entrypoint-initdb.d/10-partitions.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U morapay -d morapay']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports: ['6379:6379']
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  mailhog:
    image: mailhog/mailhog:latest
    restart: unless-stopped
    ports:
      - '1025:1025' # SMTP
      - '8025:8025' # web UI
    logging:
      driver: none

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: morapay
      MINIO_ROOT_PASSWORD: morapay-local-only
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - miniodata:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  redisdata:
  miniodata:
