# Guardrail G7 — no secrets in the repository, ever.
# Run locally by the pre-commit hook and in CI; CI fails the build on any hit.

title = "MoraPay gitleaks configuration"

[extend]
useDefault = true

[[rules]]
id = "morapay-generic-signing-secret"
description = "A provider signing secret assigned inline"
regex = '''(?i)(signing_?secret|webhook_?secret|hmac_?key)\s*[:=]\s*['"][A-Za-z0-9+/=_\-]{16,}['"]'''
tags = ["secret", "webhook"]

[[rules]]
id = "morapay-database-url"
description = "A database URL with an embedded password"
regex = '''(?i)postgres(ql)?:\/\/[^:\s]+:[^@\s]{6,}@'''
tags = ["secret", "database"]

[allowlist]
description = "Documented placeholders only — these must never hold real values"
# Match against the whole line, not just the captured secret: the local
# development credential is only recognisable in context.
regexTarget = "line"
paths = [
  '''\.env\.example$''',
  '''pnpm-lock\.yaml$''',
]
regexes = [
  '''postgres(ql)?:\/\/morapay:morapay@''', # the local-only development credential
  '''change-me''',
  '''replace-in-vault''',
  '''ci-only-[a-z-]+-not-a-real-key''',     # CI fixtures, meaningless outside a runner
  # A connection string whose password is a variable reference — `${VAR}`,
  # `${VAR:?}`, `$(cmd)` — holds no secret, it holds the instruction to fetch
  # one at runtime. Deliberately narrow: the password portion must be entirely
  # an interpolation, so a literal alongside a variable is still caught.
  '''postgres(ql)?:\/\/[^:\s]+:\$[{(][^@\s]*[})]@''',
]
